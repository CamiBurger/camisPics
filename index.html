<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>camis.pics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #000;
      overflow-x: hidden;
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #site-title {
      position: sticky;
      top: 0;
      z-index: 10;
      text-align: center;
      padding: 1em 0 0.6em;
      font-size: min(2.8vh, 4vw);
      cursor: pointer;
      background: linear-gradient(#000 60%, transparent);
    }

    #gallery {
      display: flex;
      align-items: flex-start;
      gap: 1.2vw;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.2vw 2vw;
    }

    .col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1.2vw;
    }

    .col img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
    }

    #blurb {
      max-width: 60ch;
      margin: 0 auto;
      padding: 4vh 8vw 8vh;
      text-align: center;
      font-size: min(2.2vh, 3.2vw);
      line-height: 1.5;
      color: #ccc;
    }

    #zoom-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    #zoom-overlay.active { opacity: 1; pointer-events: auto; }
    #zoom-overlay img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      cursor: zoom-out;
    }
  </style>
</head>
<body>
  <div id="site-title" onclick="location.reload()">camis.pics</div>
  <main id="gallery"></main>
  <p id="blurb"></p>
  <div id="zoom-overlay"><img id="zoom-img" alt="" /></div>

  <script>
    const gallery = document.getElementById('gallery');
    const blurbEl = document.getElementById('blurb');
    const overlay = document.getElementById('zoom-overlay');
    const zoomImg = document.getElementById('zoom-img');

    let cols = [];
    let colRatios = []; // accumulated (naturalHeight/naturalWidth) per column
    let colCount = 0;
    let cards = []; // placed <img> elements, in placement order

    // wide (landscape-ish) screens get 3 columns, narrow (portrait) get 2 —
    // recomputed on every resize/orientation change so rotation never breaks the layout
    function getColCount() {
      return window.innerWidth / window.innerHeight >= 1.5 ? 3 : 2;
    }

    // columns share a width, so accumulated aspect-ratio sum is a proxy for
    // rendered height — this is what actually keeps column lengths even,
    // since offsetHeight is meaningless before an image has loaded
    function shortestCol() {
      return colRatios.reduce((best, r, i) => r < colRatios[best] ? i : best, 0);
    }

    function buildColumns(count) {
      gallery.innerHTML = '';
      cols = [];
      colRatios = new Array(count).fill(0);
      colCount = count;
      for (let i = 0; i < count; i++) {
        const col = document.createElement('div');
        col.className = 'col';
        gallery.appendChild(col);
        cols.push(col);
      }
    }

    // redistribute already-loaded <img> elements into the (new) column count,
    // using their known ratio so the rebalance is exact, not a re-guess
    function redistribute() {
      buildColumns(getColCount());
      cards.forEach(img => {
        const idx = shortestCol();
        cols[idx].appendChild(img);
        colRatios[idx] += Number(img.dataset.ratio || 1);
      });
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function openZoom(src) {
      zoomImg.src = src;
      overlay.classList.add('active');
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
    }
    function closeZoom() {
      overlay.classList.remove('active');
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
    }
    overlay.addEventListener('click', closeZoom);
    window.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });

    buildColumns(getColCount());

    // images are placed once loaded (not on creation), so column balancing
    // uses each photo's real aspect ratio instead of an unloaded 0px guess
    function placeImage(img, ratio) {
      img.dataset.ratio = ratio;
      const idx = shortestCol();
      cols[idx].appendChild(img);
      colRatios[idx] += ratio;
      cards.push(img);
    }

    fetch('photos.json')
      .then(r => r.json())
      .then(photos => {
        shuffle(photos).forEach(photo => {
          const img = document.createElement('img');
          img.alt = '';
          img.addEventListener('click', () => openZoom(photo.url));
          img.addEventListener('load', () => {
            placeImage(img, img.naturalHeight / img.naturalWidth || 1);
          });
          img.addEventListener('error', () => placeImage(img, 1));
          img.src = photo.url;
        });
      });

    fetch('blurb.json')
      .then(r => r.json())
      .then(data => { blurbEl.textContent = data.text; });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const newCount = getColCount();
        if (newCount !== colCount) redistribute();
      }, 120);
    });
  </script>
</body>
</html>
